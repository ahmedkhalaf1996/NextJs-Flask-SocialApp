name: CI/CD Pipeline

on:
    push:
        branches:
            - main 
            - k8s
    pull_request:
        branches:
            - main 

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true 

jobs:
# --- 1 backend tests   ---------------------------

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code 
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.14'
            cache: 'pip'
            cache-dependency-path: 'backend/requirements.txt'
        - name: Install backend dependencies
          working-directory: ./backend 
          run: |
            pip install -r requirements.txt
            pip install pytest mongomock pytest-mock
        
        - name: Run backend Tests
          working-directory: ./backend 
          run: |
            python -m pytest tests/ -v --tb=short > pytest-summary.txt
            cat pytest-summary.txt
        - name: Add test summary to Github
          if: always()
          run: |
            echo "## backend Test Results " >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 10 ./backend/pytest-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY

# --- 1 Frontend E2E tests   ---------------------------


  frontend-tests:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest

    # add a mondogb service for the real backend to connect to during e2e tests
    services:
        mongodb:
            image: mongo:latest
            ports:
                - 27017:27017

    steps:
        - name: Checkout code 
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            cache-dependency-path: './frontend/package-lock.json'
        
            
        - name: Install frontend  dependencies
          working-directory: ./frontend
          run: npm ci

        - name: Install Playwright Browsers
          working-directory: ./frontend
          run: npx playwright install --with-deps chromium


        - name: Setup Python (for Flask Backend )
          uses: actions/setup-python@v5
          with:
            python-version: '3.14'

        - name: Install backend dependencies
          working-directory: ./backend 
          run:  pip install -r requirements.txt

        - name: Start Flask bakckend (in background)
          working-directory: ./backend 
          env: 
            MONGO_URI: mongodb://localhost:27017/social_app_test
            JWT_SECRET_KEY:  test_secret_key
          run: | 
            nohup python app.py > backend.log 2>&1 &
            echo "Wating for Flask server to start ..."
            sleep 5


            
        - name: check backend status 
          working-directory: ./backend
          run: cat backend.log 

        - name: frontend  build
          working-directory: ./frontend
          run: npm run build

        - name: run Playwright tests
          working-directory: ./frontend
          run : npm run test:e2e
          env:
            CI: true
        
        - name: Add Summary to GitHub
          if: always()
          run: |
           echo "## Frontend E2E Test Results " >> $GITHUB_STEP_SUMMARY
           echo "The E2E tests have complated ! you can download the full html playwright report form the artifacts section below." >> $GITHUB_STEP_SUMMARY
        
        - name: Upload Playwright Report 
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-report
            path: frontend/playwright-report/
            retention-days: 1


# --- 3 Build and Push Docker Images   ---------------------------

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    # this is condition only for deploy form k8s branch pushes 
    if: github.event_name == 'push' && github.ref == 'refs/heads/k8s'

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      
      - name: Read version from manifest
        id: version
        run: |
          TAG=$(grep 'image: ahmedkhalaf666/next-flask-social-backend:' k8s/backend/deployment.yaml | sed 's/.*://' | tr -d ' \r\n')
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Building version : ${TAG}"
      
      - name: log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Setup Docke buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ahmedkhalaf666/next-flask-social-backend:${{ steps.version.outputs.TAG }}
            ahmedkhalaf666/next-flask-social-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000 
          tags: |
            ahmedkhalaf666/next-flask-social-frontend:${{ steps.version.outputs.TAG }}
            ahmedkhalaf666/next-flask-social-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Write build summary
        if: always()
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          echo "## Docker build summary" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag" >> $GITHUB_STEP_SUMMARY
          echo "| ---- | ----" >> $GITHUB_STEP_SUMMARY
          echo "|  ahmedkhalaf666/next-flask-social-backend | ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "|  ahmedkhalaf666/next-flask-social-frontend | ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "done"
