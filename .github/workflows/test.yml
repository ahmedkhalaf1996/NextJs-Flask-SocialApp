name: Full-Stack Test Suite 


on:
    push:
        branches:
            - main 
            - automation-testing
    pull_request:
        branches:
            - main 
            - automation-testing


jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code 
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.14'
            cache: 'pip'
            cache-dependency-path: 'backend/requirements.txt'
        - name: Install backend dependencies
          working-directory: ./backend 
          run: |
            pip install -r requirements.txt
            pip install pytest mongomock pytest-mock
        
        - name: Run backend Tests
          working-directory: ./backend 
          run: |
            python -m pytest tests/ -v --tb=short > pytest-summary.txt
            cat pytest-summary.txt
        - name: Add test summary to Github
          if: always()
          run: |
            echo "## backend Test Results " >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 10 ./backend/pytest-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY








