apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace:  social-app
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ahmedkhalaf666/next-flask-social-backend:v2.2.0
        ports:
          - containerPort: 5000
        envFrom:
          - configMapRef:
              name: backend-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /docs
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /docs
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 30
